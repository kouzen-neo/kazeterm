name: Release

# Build and publish a signed arm64-v8a APK. Trigger manually with a version, or push a v* tag.
# The release notes come from CHANGELOG.md; no account or author details are stored in this file.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.1 (the v prefix is added for the tag)"
        required: true
        default: "1.0.0"
      versionCode:
        description: "Optional versionCode override (defaults to 1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Signed APK and GitHub Release
    # Google provides aapt2 for Linux only on x86_64; the native library is cross-compiled
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
            v="${v#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install toolchain from rust-toolchain.toml and the Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - name: Install Zig
        env:
          ZIG_VERSION: 0.17.0
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components 1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: target/ghostty
          key: libghostty-vt-${{ hashFiles('scripts/fetch-ghostty') }}

      - name: Fetch libghostty-vt
        run: scripts/fetch-ghostty

      - name: Clippy for Android
        env:
          CARGO_TARGET_DIR: target/android
        run: cargo ndk -t arm64-v8a --platform 30 clippy --release -p appine-android -p appine-kernel -- -D warnings

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/appine-release.p12"
          chmod 600 "$RUNNER_TEMP/appine-release.p12"

      - name: Build signed release APK
        working-directory: android
        env:
          APPINE_RELEASE_STORE_FILE: ${{ runner.temp }}/appine-release.p12
          APPINE_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          APPINE_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          APPINE_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          version_args="-PversionName=${{ steps.version.outputs.version }}"
          if [ -n "${{ inputs.versionCode }}" ]; then
            version_args="$version_args -PversionCode=${{ inputs.versionCode }}"
          fi
          ./gradlew assembleRelease lintDebug --console=plain $version_args

      - name: Rename and checksum
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          out=target/release
          mkdir -p "$out"
          cp android/app/build/outputs/apk/release/app-release.apk "$out/Appine-arm64-v8a-v$V.apk"
          cp android/app/build/outputs/mapping/release/mapping.txt "$out/mapping-v$V.txt"
          (cd "$out" && sha256sum "Appine-arm64-v8a-v$V.apk" "mapping-v$V.txt" > sha256sums.txt)

      - name: Write release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          out=target/release
          notes=$(sh scripts/release-notes "$V")
          if [ -z "$notes" ]; then notes="No CHANGELOG entry for v$V."; fi
          sha=$(awk '$2 ~ /Appine-arm64-v8a/ { print $1 }' "$out/sha256sums.txt")
          {
            echo "# Appine v$V"
            echo
            echo "$notes"
            echo
            echo "---"
            echo
            echo "## APK"
            echo
            echo "- **\`Appine-arm64-v8a-v$V.apk\`**"
            echo "  sha256: \`$sha\`"
            echo
            echo "Click a file below to download."
            echo
            echo "---"
            echo
            echo "*Full changelog: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/master/CHANGELOG.md)*"
            echo
            echo "Complete corresponding source for this AGPL build: this public repository at commit $GITHUB_SHA."
            echo
            echo 'Licensed under AGPL-3.0-or-later. Open-source notices are bundled in the app (Settings → Open source licenses) and under android/app/src/main/assets/notices/.'
          } > "$out/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          out=target/release
          gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --title "Appine v$V" \
            --notes-file "$out/notes.md" \
            "$out/Appine-arm64-v8a-v$V.apk" \
            "$out/mapping-v$V.txt" \
            "$out/sha256sums.txt"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/appine-release.p12"
