[package]
name = "kazeterm-android"
description = "KazeTerm's native library for the Android app (JNI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kazeterm"
crate-type = ["cdylib"]

[dependencies]
kazeterm-kernel.workspace = true
jni = "0.21.1"
libc.workspace = true

[build-dependencies]
cc.workspace = true

[features]
# See kazeterm-kernel's features of the same names; app/build.gradle.kts enables them in the debug app
test-hooks = ["kazeterm-kernel/test-hooks"]
borrow-check = ["kazeterm-kernel/borrow-check"]
