[package]
name = "kazeterm-run"
description = "Run a guest program from the host terminal (development front end)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kazeterm-hal.workspace = true
kazeterm-kernel.workspace = true

[features]
# Differential tests, LTP and the survey all use this front end's release build, so by default they
# check borrows too (the kazeterm-kernel feature of the same name)
default = ["borrow-check"]
borrow-check = ["kazeterm-kernel/borrow-check"]

[dev-dependencies]
kazeterm-bench.workspace = true
